name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast PR gate. No network, no live server. <30s.
  # Compiles main + runs the pure-logic unit suite + smoke-publishes to
  # mavenLocal so we know pix's resolution path still works.
  lib-unit:
    name: Lib (unit tests + publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :lib:test --no-daemon

      - name: Publish lib to local Maven (smoke)
        run: ./gradlew :lib:publishToMavenLocal --no-daemon

      - name: Upload unit-test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lib-unit-test-report
          path: lib/build/reports/tests/test/
          retention-days: 7

  # Catches Compose/AGP/Kotlin compiler regressions the :lib JVM build can't
  # see (different toolchain, different targets). Debug only — release would
  # need a keystore.
  app:
    name: App (Android assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

  # Server-dependent scenario suite (256 tests) against a CONTAINERIZED
  # obscura-server (pinned) instead of live prod — so it's deterministic,
  # isolated, and safe to run on every PR (no rate limits, no prod pollution).
  # OBSCURA_TEST_API points the tests at the local container.
  lib-integration:
    name: Lib (integration tests, containerized server)
    runs-on: ubuntu-latest
    env:
      OBSCURA_SERVER_REF: 010868e00a7d4e54724ca724622d25ea2b21c3a4  # release v0.9.1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Start obscura-server (pinned)
        run: |
          git clone https://github.com/barrelmaker97/obscura-server /tmp/obscura-server
          cd /tmp/obscura-server
          git checkout "$OBSCURA_SERVER_REF"
          git submodule update --init --recursive
          docker compose up -d --build --wait

      - name: Wait for server ready
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3000/; then echo "server up"; exit 0; fi
            sleep 5
          done
          echo "server did not become ready" >&2
          (cd /tmp/obscura-server && docker compose logs obscura-server | tail -50)
          exit 1

      - name: Integration tests
        env:
          OBSCURA_TEST_API: http://localhost:3000
        run: ./gradlew :lib:integrationTest --no-daemon

      - name: Upload integration-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lib-integration-test-report
          path: lib/build/reports/tests/integrationTest/
          retention-days: 14
